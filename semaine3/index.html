<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivoire-Immo CRM</title>
    <link rel="stylesheet" href="/semaine3/crm/src/style.css">
  </head>
  <body>
    <header class="entete-principale">
      <div class="conteneur">
        <h1>Ivoire-Immo CRM</h1>
        <p>Gestion de prospects et ventes</p>
      </div>
    </header>

    <main class="conteneur">
      <section class="panneau-formulaire">
        <h2>Nouveau Client</h2>
        <form id="formulaire-client">
          <div class="groupe-champs">
            <div class="champ">
              <label for="nom">Nom Complet</label>
              <input type="text" id="nom" placeholder="Ex: Moussa Koné" required />
            </div>
            <div class="champ">
              <label for="telephone">Téléphone</label>
              <input type="tel" id="telephone" placeholder="Ex: 07 07 10 20 30" required />
            </div>
          </div>

          <div class="groupe-champs">
            <div class="champ">
              <label for="email">Email (Optionnel)</label>
              <input type="email" id="email" placeholder="client@email.com" />
            </div>
            <div class="champ">
              <label for="statut">Statut Actuel</label>
              <select id="statut" required>
                <option value="Prospect">Prospect</option>
                <option value="En Visite">En Visite</option>
                <option value="Négociation">Négociation</option>
                <option value="Vendu">Vendu</option>
                <option value="Annulé">Annulé</option>
              </select>
            </div>
          </div>

          <div class="champ">
            <label for="note">Note / Besoin</label>
            <textarea id="note" rows="2" placeholder="Ex: Cherche terrain 500m² à Bingerville"></textarea>
          </div>

          <button type="submit" class="bouton-ajouter">
            Ajouter au CRM
          </button>
        </form>
      </section>

      <section class="panneau-liste">
        <div class="entete-liste">
          <h2>Liste des Clients</h2>
          <span id="compteur-clients" class="badge-compteur">0 clients</span>
        </div>
        
        <div class="conteneur-tableau">
          <table class="tableau-clients">
            <thead>
              <tr>
                <th>Nom & Contact</th>
                <th>Note</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="liste-clients">
              </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/semaine3/crm/dist/main.js"></script>
  </body>
</html>
